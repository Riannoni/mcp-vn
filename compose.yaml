services:
  game:
    build: .
    container_name: mcp-vn
    restart: unless-stopped
    environment:
      VN_HOST: "0.0.0.0"
      VN_PORT: "3100"
      VN_DATA_DIR: "/data"
      VN_PUBLIC_ORIGIN: "${VN_PUBLIC_ORIGIN}"
      VN_WORKER_TOKEN: "${VN_WORKER_TOKEN}"
      VN_ASSET_SECRET: "${VN_ASSET_SECRET}"
      VN_LOCAL_MODEL_URL: "http://192.168.50.27:11434"
      VN_LOCAL_MODEL_ID: "qwen3.5:9b-q4_K_M"
      VN_LOCAL_NARRATOR_MODEL: "cydonia:24b-v4.3-iq4_xs"
      VN_LOCAL_NARRATOR_FALLBACK: "qwen3.5:9b-q4_K_M"
      VN_LOCAL_ROUTER_TOKEN: "${VN_WORKER_TOKEN}"
    ports:
      - "192.168.50.29:3100:3100"
      - "10.28.0.3:3100:3100"
    volumes:
      - "./data:/data:rw"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
